# Dance photos only. Cast and guest photos come from Assets via prepare-people-photos.yml.
name: Prepare photo assets

on:
  push:
    branches: [main]
    paths:
      - 'Images/Dances/Week */**'
      - 'scripts/build-dance-photo-assets.mjs'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-photo-assets-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run photos
      - run: npm run photos:check
      - run: npm run check
      - run: npm run check:owner
      - name: Commit generated photo assets when changed
        run: |
          git add -- Images/Dances dance-photo-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare optimized dance photos'
          git push origin HEAD:main
