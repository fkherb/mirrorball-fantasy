name: Verify static assets

on:
  push:
  pull_request:

jobs:
  cache-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run photos
      - run: npm run photos:check
      - run: node scripts/check-cache-keys.mjs
      - run: node scripts/check-auth-buttons.mjs
      - run: npm run check:migration
      - run: node scripts/check-market-predictions.mjs
      - run: node scripts/check-market-history-pages.mjs
      - run: node --experimental-strip-types scripts/check-market-sync.mjs
      - run: node scripts/check-market-history-backfill.mjs
      - run: node scripts/check-airing-policy.mjs
      - run: node scripts/check-postdraft-view.mjs
      - run: node scripts/check-dance-song-fields.mjs
      - run: node scripts/check-score-desk-view.mjs
      - run: node scripts/check-dance-images.mjs
      - run: node scripts/check-next-week-dances.mjs
      - run: node scripts/check-profile-picture.mjs
      - run: node scripts/check-research-experience.mjs
      - run: node scripts/check-scoring.mjs
      - run: node scripts/check-schema-baseline.mjs
